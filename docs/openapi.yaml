                  last: 'http://localhost:8000/api/products?per_page=2&page=11'
                  prev: null
                  next: 'http://localhost:8000/api/products?per_page=2&page=2'
                meta:
                  current_page: 1
                  from: 1
                  last_page: 11
                  links:
                    -
                      url: null
                      label: '&laquo; Previous'
                      page: null
                      active: false
                    -
                      url: 'http://localhost:8000/api/products?per_page=2&page=1'
                      label: '1'
                      page: 1
                      active: true
