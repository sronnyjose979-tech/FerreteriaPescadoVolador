                    id: 1
                    id_categoria: 1
                    id_marca: 1
                    id_unidad: 1
                    nombre: 'assumenda quam non'
                    descripcion: 'Sed et quaerat similique quis sit ab consequatur fugit sequi perspiciatis accusamus.'
                    sku: FERR-37065
                    codigo_barras: '8851706592717'
                    precio: 41207.37
                    tasa_impuesto: 0.13
                    cantidad_stock: 124
                    stock_minimo: 10
                    stock_maximo: 479
                    peso: '18.60'
                    esta_activo: true
                  -
                    id: 2
                    id_categoria: 3
                    id_marca: 2
                    id_unidad: 3
                    nombre: 'enim omnis ea'
                    descripcion: 'Voluptates odio aliquid dicta et corrupti et vel aliquid voluptates.'
                    sku: FERR-94535
                    codigo_barras: '3180125059200'
                    precio: 40139.64
                    tasa_impuesto: 0.13
                    cantidad_stock: 169
                    stock_minimo: 5
                    stock_maximo: 258
                    peso: '11.73'
                    esta_activo: true
