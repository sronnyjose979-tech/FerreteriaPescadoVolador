openapi: 3.0.3
info:
  title: 'Ferreteria Pescado Volador - API'
  version: 2.0.0
  description: |-
    API REST en Laravel para la ferretería. Todas las respuestas son JSON y los errores nunca incluyen trazas.

    Autenticación: POST /api/login devuelve un token Bearer que vence a las 2 horas y lleva como capacidades (abilities) los permisos del rol. POST /api/logout revoca los tokens de la persona.

    Autorización en tres niveles: capacidad del token (403), permiso del rol en la política con #[Authorize] (403) y nuevamente en el servicio con Gate::authorize. Las ventas y compras solo las ve quien las registró o un admin; para otra persona responden 404.

    Roles: admin (todos los permisos), cajero y bodeguero. Cada operación indica el permiso requerido y los roles que lo tienen.

    Códigos de error: 400 JSON mal formado, 401 sin token o token vencido/revocado, 403 sin permiso, 404 recurso inexistente, 409 regla de negocio, 422 validación (errores por campo), 429 demasiados intentos de inicio de sesión.
  contact:
    name: 'Equipo IF0009'
    email: proyecto@ucr.ac.cr
servers:
  -
    url: 'http://localhost:8000'
    description: Local
security:
  -
    bearerAuth: []
tags:
  -
    name: Auth
    description: 'Registro, inicio y cierre de sesión con tokens de Sanctum'
  -
    name: Products
  -
    name: Categories
  -
    name: Brands
  -
    name: Units
  -
    name: Suppliers
  -
    name: Purchases
  -
    name: PurchaseItems
  -
    name: Customers
  -
    name: Sales
  -
    name: SaleItems
  -
    name: Payments
  -
    name: InventoryMovements
paths:
  /api/register:
    post:
      tags:
        - Auth
      summary: 'Registrar una cuenta'
      description: 'Crea la cuenta con la contraseña derivada con bcrypt y le asigna el rol cajero.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: 'Valor único.'
                password:
                  type: string
                  minLength: 8
                  description: 'Requiere password_confirmation con el mismo valor. Mínimo 8 caracteres, con mayúsculas, minúsculas, números y símbolos.'
              required:
                - name
                - email
                - password
            example:
              name: 'Ana Mora'
              email: ana@example.com
              password: 'Secreta#2026'
              password_confirmation: 'Secreta#2026'
      responses:
        '201':
          description: 'Cuenta creada'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
              example:
                data:
                  id: 4
                  nombre: 'Ana Mora'
                  correo: ana@example.com
                  roles:
                    - cajero
                message: 'Usuario registrado correctamente.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/login:
    post:
      tags:
        - Auth
      summary: 'Iniciar sesión'
      description: 'Devuelve un token Bearer con vencimiento de 2 horas y con los permisos del rol como capacidades. El mensaje de error es el mismo si el correo no existe o si la contraseña es incorrecta. Tras 5 intentos fallidos por minuto (correo + IP) responde 429.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
              required:
                - email
                - password
            examples:
              correcto:
                value:
                  email: cajero@example.com
                  password: password
              invalido:
                value:
                  email: no-es-correo
                  password: ''
      responses:
        '200':
          description: 'Token emitido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                token: 5|Xq3kM2vL8pR1sT6wY9zA4bC7dE0fG2hJ5kL8mN1p
                token_type: Bearer
                expires_at: '2026-09-28T03:17:27.000000Z'
                abilities:
                  - 'view products'
                  - 'view customers'
                  - 'view sales'
                  - 'create sales'
        '401':
          description: 'Credenciales incorrectas (mismo mensaje exista o no la cuenta)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Las credenciales proporcionadas son incorrectas.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/logout:
    post:
      tags:
        - Auth
      summary: 'Cerrar sesión'
      description: 'Revoca todos los tokens de la persona. Usar el token después responde 401.'
      responses:
        '200':
          description: 'Sesión cerrada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Sesión cerrada correctamente.'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user:
    get:
      tags:
        - Auth
      summary: 'Persona autenticada'
      responses:
        '200':
          description: 'Datos de la persona y sus roles'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              example:
                data:
                  id: 2
                  nombre: cajero
                  correo: cajero@example.com
                  roles:
                    - cajero
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/products:
    get:
      tags:
        - Products
      summary: 'Listado paginado'
      description: 'Permiso requerido: `view products` (roles: admin, cajero, bodeguero).'
