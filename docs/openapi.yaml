            type: boolean
        -
          name: min_price
          in: query
          schema:
            type: number
        -
          name: max_price
          in: query
          schema:
            type: number
      responses:
        '200':
          description: 'Lista paginada'
          content:
            application/json:
              schema:
                type: object
                properties:
