                  per_page: 2
                  to: 2
                  total: 22
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Products
      summary: Crear
      description: 'Permiso requerido: `create products` (roles: admin, bodeguero).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Debe existir en categories.id.'
                brand_id:
                  type: integer
                  description: 'Debe existir en brands.id.'
                unit_id:
                  type: integer
                  description: 'Debe existir en units.id.'
                name:
                  type: string
                  maxLength: 150
                description:
                  type: string
                  nullable: true
                  maxLength: 1000
                price:
                  type: number
                  minimum: 0
                  maximum: 99999999.99
                sku:
