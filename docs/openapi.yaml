      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Suppliers]
      summary: Actualizar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Suppliers]
      summary: Eliminar proveedor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Eliminado
        '409':
          description: Tiene dependencias
  /api/purchases:
    get:
      tags: [Purchases]
      summary: Listado compras
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Purchase'
    post:
      tags: [Purchases]
      summary: Crear compra con detalle transaccional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInput'
            examples:
              conDescuento:
                value:
                  id_purchase: PUR-100
                  user_id: 1
                  id_supplier: SUP100
                  purchase_status: pendiente
                  purchase_total: 11400
                  items:
                    - product_id: 1
                      quantity: 2
                      unit_cost: 6000
                      subtotal: 12000
              sinDetalle:
                value:
                  id_purchase: PUR-101
                  user_id: 1
                  id_supplier: SUP100
                  purchase_status: pendiente
                  purchase_total: 0
                  items: []
      responses:
        '201':
          description: Creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '422':
          description: Regla de negocio violada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinDetalle:
                  value:
                    message: No se puede confirmar una compra sin detalle.
                subtotalIncoherente:
                  value:
                    message: El subtotal no coincide con cantidad por costo unitario.
  /api/purchases/{id}:
    get:
      tags: [Purchases]
      summary: Detalle compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Purchases]
      summary: Actualizar compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Purchases]
      summary: Eliminar compra
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Eliminado
        '409':
          description: Tiene detalles
  /api/purchase-items:
    get:
      tags: [PurchaseItems]
      summary: Listado detalles de compra
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PurchaseItem'
    post:
      tags: [PurchaseItems]
      summary: Crear detalle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseItemInput'
      responses:
        '201':
          description: Creado
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/purchase-items/{id}:
    get:
      tags: [PurchaseItems]
      summary: Detalle item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [PurchaseItems]
      summary: Actualizar detalle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseItemInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [PurchaseItems]
      summary: Eliminar detalle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado
  /api/purchases/{purchaseId}/items:
    get:
      tags: [PurchaseItems]
      summary: Listado anidado items de una compra
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada anidada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PurchaseItem'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        maximum: 50
      description: Maximo 50
    Q:
      name: q
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, price, stock_quantity, id, created_at, supplier_first_name, purchase_total]
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
    Product:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        brand_id:
          type: integer
        unit_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        price:
          type: number
          format: float
        tax_rate:
          type: number
        stock_quantity:
          type: integer
        minimum_stock:
          type: integer
        maximum_stock:
          type: integer
          nullable: true
        weight:
          type: number
          nullable: true
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        brand:
          $ref: '#/components/schemas/Brand'
        unit:
          $ref: '#/components/schemas/Unit'
    ProductInput:
      type: object
      required: [category_id, brand_id, unit_id, name, price, sku]
      properties:
        category_id:
          type: integer
        brand_id:
          type: integer
        unit_id:
          type: integer
        name:
          type: string
          maxLength: 200
        description:
          type: string
        sku:
          type: string
          maxLength: 50
        barcode:
          type: string
        price:
          type: number
          minimum: 0
        tax_rate:
          type: number
        stock_quantity:
          type: integer
          minimum: 0
        minimum_stock:
          type: integer
        maximum_stock:
          type: integer
        weight:
          type: number
        image_url:
          type: string
          format: uri
        is_active:
          type: boolean
    Category:
      type: object
      properties:
        id:
          type: integer
        category_name:
          type: string
        description:
          type: string
    CategoryInput:
      type: object
      required: [category_name]
      properties:
        category_name:
          type: string
        description:
          type: string
    Brand:
      type: object
      properties:
        id:
          type: integer
        brand_name:
          type: string
    BrandInput:
      type: object
      required: [brand_name]
      properties:
        brand_name:
          type: string
    Unit:
      type: object
      properties:
        id:
          type: integer
        unit_name:
          type: string
    UnitInput:
      type: object
      required: [unit_name]
      properties:
        unit_name:
          type: string
    Supplier:
      type: object
      properties:
        id_supplier:
          type: string
        supplier_first_name:
          type: string
        supplier_last_name:
          type: string
        supplier_phone:
          type: string
        supplier_address:
          type: string
        supplier_email:
          type: string
          format: email
        supplier_type:
          type: string
    SupplierInput:
      type: object
      required: [id_supplier, supplier_first_name, supplier_last_name, supplier_phone, supplier_address, supplier_email]
      properties:
        id_supplier:
          type: string
        supplier_first_name:
          type: string
        supplier_last_name:
          type: string
        supplier_phone:
          type: string
        supplier_address:
          type: string
        supplier_email:
          type: string
          format: email
        supplier_type:
          type: string
    Purchase:
      type: object
      properties:
        id_purchase:
          type: string
        user_id:
          type: integer
        id_supplier:
          type: string
        purchase_total:
          type: number
        purchase_status:
          type: string
          enum: [pendiente, confirmada, recibida, cancelada]
        supplier:
          $ref: '#/components/schemas/Supplier'
        purchase_items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
    PurchaseInput:
      type: object
      required: [id_purchase, user_id, id_supplier, purchase_status]
      properties:
        id_purchase:
          type: string
        user_id:
          type: integer
        id_supplier:
          type: string
        purchase_total:
          type: number
        purchase_status:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItemInput'
    PurchaseItem:
      type: object
      properties:
        id:
          type: integer
        id_purchase:
          type: string
        product_id:
          type: integer
        quantity:
          type: integer
        unit_cost:
          type: number
        subtotal:
          type: number
    PurchaseItemInput:
      type: object
      required: [id_purchase, product_id, quantity, unit_cost, subtotal]
      properties:
        id_purchase:
          type: string
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unit_cost:
          type: number
          minimum: 0
        subtotal:
          type: number
          minimum: 0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Prohibido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Recurso no encontrado.
    ValidationError:
      description: Datos invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Datos invalidos
            errors:
              name:
                - El campo nombre es obligatorio.
              price:
                - El campo precio debe ser un numero.
