openapi: 3.0.3
info:
  title: Ferreteria Pescado Volador - API
  description: API REST principal en Laravel para ferreteria. Contrato basado en entidad Product con 16 atributos y relaciones Category, Brand, Unit. Incluye recursos anidados para relaciones.
  version: 1.0.0
  contact:
    name: Equipo IF0009
    email: proyecto@ucr.ac.cr
servers:
  - url: http://localhost:8000
    description: Local
  - url: https://api.ferreteria-ucr.com
    description: Produccion
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Autenticacion
  - name: Products
    description: Entidad principal del contrato comparativo
  - name: Categories
  - name: Brands
  - name: Units
  - name: Purchases
  - name: PurchaseItems
  - name: Suppliers
paths:
  /api/login:
    post:
      tags: [Auth]
      summary: Inicio de sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              correcto:
                value:
                  email: admin@ferreteria.com
                  password: secret123
              invalido:
                value:
                  email: no-email
                  password: ""
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 1|abc123
              example:
                token: 1|abc123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/products:
    get:
      tags: [Products]
      summary: Listado paginado de productos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - name: category_id
          in: query
          schema:
            type: integer
        - name: brand_id
          in: query
          schema:
            type: integer
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
              example:
                data:
                  - id: 1
                    name: Martillo de Una Profesional 16oz
                    sku: SKU-MART-016-001
                    price: 12500.00
                    stock_quantity: 45
                current_page: 1
                last_page: 5
                per_page: 10
                total: 45
                links:
                  first: /api/products?page=1
                  last: /api/products?page=5
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            examples:
              correcto:
                value:
                  category_id: 1
                  brand_id: 2
                  unit_id: 1
                  name: Martillo de Una Profesional 16oz
                  description: Martillo de acero forjado
                  sku: SKU-MART-016-001
                  barcode: "7501234567890"
                  price: 12500.00
                  tax_rate: 13.00
                  stock_quantity: 45
                  minimum_stock: 10
                  maximum_stock: 100
                  weight: 0.45
                  image_url: https://ferreteria-ucr.com/images/martillo-16oz.jpg
                  is_active: true
              invalido:
                value:
                  name: ""
                  price: -5
                  sku: ""
      responses:
        '201':
          description: Creado
          headers:
            Location:
              schema:
                type: string
              example: /api/products/6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/products/{id}:
    get:
      tags: [Products]
      summary: Detalle de producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Products]
      summary: Actualizar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tiene dependencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No se puede eliminar el producto porque tiene dependencias activas.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/products/inventory-summary:
    get:
      tags: [Products]
      summary: Reporte agregado por categoria
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category_name:
                      type: string
                    total_products:
                      type: integer
                    total_stock:
                      type: integer
                    average_price:
                      type: number
  /api/categories:
    get:
      tags: [Categories]
      summary: Listado paginado categorias
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Categories]
      summary: Crear categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Creado
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Detalle categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Actualizar categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Categories]
      summary: Eliminar categoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado
        '409':
          description: Tiene dependencias
  /api/brands:
    get:
      tags: [Brands]
      summary: Listado marcas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Brand'
    post:
      tags: [Brands]
      summary: Crear marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          description: Creado
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/brands/{id}:
    get:
      tags: [Brands]
      summary: Detalle marca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Brands]
      summary: Actualizar marca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Brands]
      summary: Eliminar marca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado
        '409':
          description: Tiene dependencias
  /api/units:
    get:
      tags: [Units]
      summary: Listado unidades
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Unit'
    post:
      tags: [Units]
      summary: Crear unidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitInput'
      responses:
        '201':
          description: Creado
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/units/{id}:
    get:
      tags: [Units]
      summary: Detalle unidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Units]
      summary: Actualizar unidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitInput'
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Units]
      summary: Eliminar unidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado
        '409':
