              name: 'Martillo de Uña Profesional 16oz'
              description: 'Martillo de acero forjado con mango de fibra de vidrio.'
              sku: SKU-MART-016-001
              barcode: '7501234567890'
              price: 12500
              tax_rate: 0.13
              stock_quantity: 45
              minimum_stock: 10
              maximum_stock: 100
              weight: 0.45
              image_url: 'https://ferreteria-ucr.com/images/martillo-16oz.jpg'
              is_active: true
