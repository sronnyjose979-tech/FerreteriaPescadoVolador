components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token personal de Sanctum obtenido en POST /api/login'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      description: 'Tamaño de página. Máximo 50.'
      schema:
        type: integer
        default: 10
        maximum: 50
    Q:
      name: q
      in: query
      description: 'Texto a buscar'
      schema:
        type: string
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
  schemas:
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              page:
                type: string
                nullable: true
              active:
                type: boolean
        path:
          type: string
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer
    Error:
      type: object
      properties:
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    User:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        correo:
          type: string
        roles:
          type: array
          items:
            type: string
    Token:
      type: object
      properties:
        token:
          type: string
        token_type:
          type: string
        expires_at:
          type: string
          format: date-time
          description: 'Fecha de vencimiento (2 horas después del inicio de sesión)'
        abilities:
          type: array
          items:
            type: string
          description: 'Capacidades del token: los permisos del rol al iniciar sesión'
    Product:
      type: object
      properties:
        id:
          type: integer
        id_categoria:
          type: integer
        id_marca:
          type: integer
        id_unidad:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
        sku:
          type: string
        codigo_barras:
          type: string
        precio:
          type: number
        tasa_impuesto:
          type: number
        cantidad_stock:
          type: integer
        stock_minimo:
          type: integer
        stock_maximo:
          type: integer
        peso:
          type: string
          description: 'Decimal con dos cifras'
        esta_activo:
          type: boolean
    InventorySummaryRow:
      type: object
      properties:
        category_name:
          type: string
        total_products:
          type: integer
        total_stock:
          type: integer
        average_price:
          type: number
    Category:
      type: object
      properties:
        'ID Categoria':
          type: integer
        Nombre:
          type: string
        Descripcion:
          type: string
    Brand:
      type: object
      properties:
        'ID Marca':
          type: integer
        Nombre:
          type: string
    Unit:
      type: object
      properties:
        'ID Unidad de Medida':
          type: integer
        Nombre:
          type: string
    Supplier:
      type: object
      properties:
        id:
          type: string
        supplier_first_name:
          type: string
        supplier_last_name:
          type: string
        supplier_phone:
          type: string
        supplier_address:
          type: string
        supplier_email:
          type: string
        supplier_type:
          type: string
        purchases:
          type: array
          items: {}
    Purchase:
      type: object
      properties:
        id_purchase:
          type: string
        user_id:
          type: integer
        id_supplier:
          type: string
        purchase_total:
          type: string
          description: 'Decimal con dos cifras'
        purchase_status:
          type: string
        purchaseItems:
          type: array
          items:
            type: object
            properties:
              'ID Detalle':
                type: integer
              'ID Compra':
                type: string
              'ID Producto':
                type: integer
              Cantidad:
                type: integer
              'Costo Unitario':
                type: string
                description: 'Decimal con dos cifras'
              SubTotal:
                type: string
                description: 'Decimal con dos cifras'
    PurchaseItem:
      type: object
      properties:
        'ID Detalle':
          type: integer
        'ID Compra':
          type: string
        'ID Producto':
          type: integer
        Producto:
          type: string
        Cantidad:
          type: integer
        'Costo Unitario':
          type: string
          description: 'Decimal con dos cifras'
        SubTotal:
          type: string
          description: 'Decimal con dos cifras'
    Customer:
      type: object
      properties:
        id_customer:
          type: string
        first_name:
          type: string
        second_name:
          type: string
        last_name1:
          type: string
        last_name2:
          type: string
        email:
          type: string
        telephone_number:
          type: string
    Sale:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        id_customer:
          type: string
          nullable: true
        sale_date:
          type: string
          format: date-time
        total:
          type: string
          description: 'Decimal con dos cifras'
        tax_amount:
          type: string
          description: 'Decimal con dos cifras'
        discount:
          type: string
          description: 'Decimal con dos cifras'
        status:
          type: string
        saleItems:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              product_id:
                type: integer
              quantity:
                type: integer
              unit_price:
                type: number
              subtotal:
                type: number
    SaleItem:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
        subtotal:
          type: number
    Payment:
      type: object
      properties:
        'ID Pago':
          type: integer
        'ID Venta':
          type: integer
        'Metodo de Pago':
          type: string
        Monto:
          type: number
        'Referencia de Transaccion':
          type: string
        Estado:
          type: string
        'Fecha de Creacion':
          type: string
          format: date-time
        'Fecha de Actualizacion':
          type: string
          format: date-time
    InventoryMovement:
      type: object
      properties:
        'ID Movimiento':
          type: integer
        'ID Producto':
          type: integer
        Tipo:
          type: string
        Cantidad:
          type: integer
        'Stock Despues':
          type: integer
        'Tipo de Origen':
          type: string
        'ID de Origen':
          type: integer
  responses:
    BadRequest:
      description: 'El cuerpo no es un JSON válido'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'El cuerpo de la solicitud no es un JSON válido.'
    Unauthorized:
      description: 'Sin token, token vencido o revocado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'No autenticado.'
    Forbidden:
      description: 'El rol o la capacidad del token no permite la acción'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'No tiene permiso para realizar esta acción.'
    NotFound:
      description: 'El recurso no existe o pertenece a otra persona'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'El recurso solicitado no existe.'
    ValidationError:
      description: 'Datos inválidos, con los errores por campo'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: 'Demasiados intentos de inicio de sesión (5 por minuto por correo e IP)'
      headers:
        Retry-After:
          description: 'Segundos que faltan para volver a intentar'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'Demasiados intentos. Intente nuevamente más tarde.'
