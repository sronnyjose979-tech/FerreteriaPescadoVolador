name: CI del Backend

on:
  push:
    branches: [ci-fallo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: php artisan test

  web:
    # Los PR de forks y Dependabot no reciben el secreto de Actions.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_URL: https://ferreteriapescadovolador.onrender.com/api

    steps:
      - uses: actions/checkout@v7
        with:
          repository: sronnyjose979-tech/FrontFerreteria
          ref: main
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
          path: web
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-fallo'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Las verificaciones pasaron. Aquí se solicitaría el despliegue."