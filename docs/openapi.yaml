                  enum:
                    - completed
                    - pending
                    - cancelled
                  maxLength: 20
            example:
              status: cancelled
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
              example:
                data:
                  'ID Pago': 21
                  'ID Venta': 1
                  'Metodo de Pago': card
                  Monto: 1000
                  'Referencia de Transaccion': TXN-00012345
                  Estado: cancelled
                  'Fecha de Creacion': '2026-09-28T01:17:28.000000Z'
                  'Fecha de Actualizacion': '2026-09-28T01:17:28.000000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Se viola una regla de negocio'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                superaTotal:
                  value:
                    message: 'La suma de los pagos no puede superar el total de la venta.'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
