name: CI/CD de la API

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci

      - name: Build application assets
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

  deploy:
    name: Deploy API to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Trigger deploy for the tested commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on main. Skipping this deployment.'
            exit 0
          fi
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo '::error::Configure the repository secret RENDER_DEPLOY_HOOK.'
            exit 1
          fi
          curl --fail --silent --output /dev/null --max-time 30 \
            --request POST --url "$RENDER_DEPLOY_HOOK&ref=$GITHUB_SHA" || {
            echo '::error::Render did not accept the deploy request.'
            exit 1
          }
