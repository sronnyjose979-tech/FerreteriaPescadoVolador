                  maxLength: 50
                  description: 'Valor único.'
                barcode:
                  type: string
                  nullable: true
                  maxLength: 50
                  description: 'Valor único.'
                stock_quantity:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                tax_rate:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 100
                minimum_stock:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1000000
                maximum_stock:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1000000
                weight:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 100000
                image_url:
                  type: string
                  nullable: true
                  format: uri
                  maxLength: 255
                is_active:
                  type: boolean
              required:
