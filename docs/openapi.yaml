        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Se viola una regla de negocio'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                stockIncoherente:
                  value:
                    message: 'La cantidad en stock no puede superar el stock máximo.'
                minimoMayorQueMaximo:
                  value:
                    message: 'El stock mínimo no puede ser mayor que el stock máximo.'
        '422':
